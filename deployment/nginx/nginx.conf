server {
    listen 80;
    server_name baby.example.com;

    # Redirect HTTP to HTTPS
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name baby.example.com;

    # TLS Certificates (Let's Encrypt / Certbot)
    ssl_certificate /etc/letsencrypt/live/baby.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/baby.example.com/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # Maximum payload size
    client_max_body_size 10M;

    # Proxy to FastAPI / WebSocket server container
    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket timeouts for persistent low-latency stream
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }
}
